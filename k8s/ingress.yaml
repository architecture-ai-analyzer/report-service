apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: report-service-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
  - host: report-service.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: report-service
            port:
              number: 8083

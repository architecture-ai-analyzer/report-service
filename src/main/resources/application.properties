spring.application.name=report-service

# Actuator endpoints configuration
management.endpoints.web.exposure.include=health,metrics,prometheus,info
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Prometheus metrics
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}

# Info endpoint
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Report Service for Architecture Analysis
info.app.version=0.0.1-SNAPSHOT

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/reports
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Liquibase Configuration
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=false

# Server Configuration
server.port=8080
server.tomcat.max-threads=200
server.tomcat.min-spare-threads=20
server.tomcat.max-connections=1000
server.tomcat.connection-timeout=60000
server.tomcat.accept-count=200

# Prevent auto-restart - FORCE COMPLETELY DISABLED
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
spring.devtools.restart.additional-paths=
spring.devtools.restart.additional-exclude=**

# AWS Configuration
# Credentials injected via environment variables, IAM Role, or default provider chain
aws.access.key=${AWS_ACCESS_KEY:}
aws.secret.key=${AWS_SECRET_KEY:}
aws.region=${AWS_REGION:us-east-2}

# SQS Configuration
aws.sqs.report-generation-queue=report-generation-queue
aws.sqs.status-update-queue=status-update-queue

# CORS Configuration for Frontend Integration
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Datadog Tracing
dd.trace.enabled=true
dd.service=report-service
dd.trace.http.client.tag.query-string=true
dd.trace.jdbc.enabled=true
dd.trace.jdbc.query-size=5000
dd.trace.logs.injection=true
dd.trace.sample.rate=1.0
dd.env=${DD_ENV:dev}
dd.version=${DD_VERSION:0.0.1-SNAPSHOT}
dd.trace.agent.host=${DD_AGENT_HOST:localhost}
dd.trace.agent.port=${DD_AGENT_PORT:8126}
dd.trace.debug=false
datadog.statsd.host=${DATADOG_STATSD_HOST:localhost}
datadog.statsd.port=${DATADOG_STATSD_PORT:8125}
